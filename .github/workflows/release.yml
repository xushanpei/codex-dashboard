name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v

  publish:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: sh scripts/build_menu_bar.sh
      - name: Package release files
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/Codex Pulse.app' dist/CodexPulse-macOS-universal.zip
          git archive --format=zip --output=dist/CodexPulse-source.zip HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/CodexPulse-macOS-universal.zip \
            dist/CodexPulse-source.zip \
            --title "Codex Pulse $GITHUB_REF_NAME" \
            --generate-notes
